<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A{i}bility — Animated Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0A0A0F;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden;
    font-family: 'Inter', sans-serif;
  }

  .container {
    position: relative; width: 900px; height: 500px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }

  /* === BACKGROUND GLOW === */
  .bg-glow {
    position: absolute; width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(161,0,255,0.08) 0%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -55%);
    animation: glowPulse 4s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -55%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -55%) scale(1.15); }
  }

  /* === WORDMARK === */
  .wordmark {
    position: relative; display: flex; align-items: baseline;
    font-size: 96px; font-weight: 700; letter-spacing: -2px;
    z-index: 2;
  }
  .letter-a, .letter-bility { color: #FFFFFF; opacity: 0; animation: letterFadeIn 0.6s ease forwards; }
  .letter-a { animation-delay: 0.8s; }
  .letter-bility { animation-delay: 2.2s; }

  .brace-group {
    position: relative; display: inline-flex; align-items: baseline;
    margin: 0;
  }
  .brace-left, .brace-right {
    color: #A100FF; font-weight: 300; font-size: 108px;
    opacity: 0; display: inline-block;
  }
  .brace-left { animation: braceAppearLeft 0.5s ease forwards; animation-delay: 1.2s; }
  .brace-right { animation: braceAppearRight 0.5s ease forwards; animation-delay: 1.2s; }

  .letter-i {
    color: #00C9A7; font-weight: 700; font-size: 96px;
    opacity: 0; animation: letterFadeIn 0.5s ease forwards; animation-delay: 1.6s;
    position: relative; margin: 0 5px;
  }

  @keyframes letterFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes braceAppearLeft {
    from { opacity: 0; transform: translateX(12px) scale(0.8); }
    to { opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes braceAppearRight {
    from { opacity: 0; transform: translateX(-12px) scale(0.8); }
    to { opacity: 1; transform: translateX(0) scale(1); }
  }

  /* === CONNECTOR + NODE === */
  .connector-group {
    position: absolute;
    top: -12px; left: 50%;
    transform: translateX(-50%);
    width: 90px; height: 30px;
    z-index: 3;
  }

  .connector-line {
    position: absolute; top: 10px; left: 0; right: 0; height: 2px;
    background: #A100FF; opacity: 0;
    animation: connectorDraw 0.4s ease forwards; animation-delay: 1.8s;
    transform-origin: center;
  }
  .connector-drop-left, .connector-drop-right {
    position: absolute; top: 10px; width: 2px; height: 0;
    background: #A100FF; opacity: 0;
    animation: dropDraw 0.3s ease forwards; animation-delay: 2.0s;
  }
  .connector-drop-left { left: 0; }
  .connector-drop-right { right: 0; }

  @keyframes connectorDraw {
    from { opacity: 0; transform: scaleX(0); }
    to { opacity: 0.5; transform: scaleX(1); }
  }
  @keyframes dropDraw {
    from { opacity: 0; height: 0; }
    to { opacity: 0.5; height: 14px; }
  }

  /* === TEAL NODE === */
  .teal-node {
    position: absolute; top: 3px; left: 50%; transform: translateX(-50%);
    width: 14px; height: 14px; border-radius: 50%;
    background: #00C9A7;
    opacity: 0; animation: nodeAppear 0.5s ease forwards; animation-delay: 1.9s;
    z-index: 4;
  }
  .teal-node::after {
    content: ''; position: absolute;
    top: -5px; left: -5px; width: 24px; height: 24px;
    border-radius: 50%; border: 1px solid rgba(0,201,167,0.3);
    opacity: 0; animation: ringPulse 2s ease-in-out infinite; animation-delay: 2.5s;
  }

  @keyframes nodeAppear {
    from { opacity: 0; transform: translateX(-50%) scale(0); }
    to { opacity: 1; transform: translateX(-50%) scale(1); }
  }
  @keyframes ringPulse {
    0% { opacity: 0; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.6); }
    100% { opacity: 0; transform: scale(2.2); }
  }

  /* === TAGLINE === */
  .tagline {
    margin-top: 28px; font-size: 16px; letter-spacing: 7px;
    color: #666; font-weight: 400; text-transform: uppercase;
    opacity: 0; animation: taglineFade 0.8s ease forwards; animation-delay: 2.6s;
    z-index: 2;
  }
  @keyframes taglineFade {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* === PARTICLES === */
  .particles {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
  }
  .particle {
    position: absolute; border-radius: 50%; opacity: 0;
    animation: particleFloat 6s ease-in-out infinite;
  }
  @keyframes particleFloat {
    0% { opacity: 0; transform: translateY(0) scale(0.5); }
    20% { opacity: 0.6; }
    80% { opacity: 0.3; }
    100% { opacity: 0; transform: translateY(-120px) scale(0); }
  }

  /* === SCAN LINE (subtle tech feel) === */
  .scan-line {
    position: absolute; width: 260px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(161,0,255,0.3), transparent);
    top: 50%; left: 50%; transform: translateX(-50%);
    opacity: 0; animation: scanPass 3s ease-in-out infinite; animation-delay: 3s;
    z-index: 1;
  }
  @keyframes scanPass {
    0% { opacity: 0; top: 35%; }
    30% { opacity: 0.6; }
    70% { opacity: 0.4; }
    100% { opacity: 0; top: 65%; }
  }

  /* === REPLAY BUTTON === */
  .replay {
    position: fixed; bottom: 30px; right: 30px;
    background: rgba(161,0,255,0.15); border: 1px solid rgba(161,0,255,0.3);
    color: #A100FF; padding: 10px 20px; border-radius: 6px;
    cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px;
    transition: all 0.2s; z-index: 10;
    opacity: 0; animation: letterFadeIn 0.5s ease forwards; animation-delay: 3.5s;
  }
  .replay:hover { background: rgba(161,0,255,0.25); transform: translateY(-1px); }

  /* === LIGHT VERSION TOGGLE === */
  body.light {
    background: #FFFFFF;
  }
  body.light .letter-a, body.light .letter-bility { color: #1C1C1E; }
  body.light .tagline { color: #8E8E93; }
  body.light .bg-glow {
    background: radial-gradient(circle, rgba(161,0,255,0.05) 0%, transparent 70%);
  }
  body.light .scan-line {
    background: linear-gradient(90deg, transparent, rgba(161,0,255,0.15), transparent);
  }

  .toggle-theme {
    position: fixed; bottom: 30px; left: 30px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: #888; padding: 10px 20px; border-radius: 6px;
    cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px;
    transition: all 0.2s; z-index: 10;
    opacity: 0; animation: letterFadeIn 0.5s ease forwards; animation-delay: 3.5s;
  }
  body.light .toggle-theme {
    background: rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.1); color: #666;
  }
  .toggle-theme:hover { transform: translateY(-1px); }

  .sound-toggle {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: #7B8494; padding: 10px 20px; border-radius: 6px;
    cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px;
    z-index: 10; opacity: 0; transition: opacity 0.5s;
  }
  .sound-toggle.show { opacity: 1; }
  .sound-toggle:hover { background: rgba(255,255,255,0.1); }

  /* Start overlay */
  .start-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(10,10,15,0.95); z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: opacity 0.5s;
  }
  .start-overlay.hidden { opacity: 0; pointer-events: none; }
  .start-text {
    font-family: 'Inter', sans-serif; font-size: 13px; color: #7B8494;
    letter-spacing: 2px; margin-top: 20px;
  }
  .start-icon {
    width: 60px; height: 60px; border-radius: 50%;
    border: 2px solid rgba(161,0,255,0.4);
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.3s, transform 0.3s;
  }
  .start-icon:hover { border-color: #A100FF; transform: scale(1.05); }
  .start-icon svg { fill: #A100FF; width: 24px; height: 24px; margin-left: 3px; }

  /* Gate animations until started */
  .container.paused *, .container.paused ~ .replay, .container.paused ~ .toggle-theme {
    animation-play-state: paused !important;
  }
</style>
</head>
<body>

<div class="start-overlay" id="startOverlay">
  <div class="start-icon">
    <svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg>
  </div>
  <div class="start-text">CLICK TO START</div>
</div>

  <div class="container paused" id="logoContainer">
    <div class="bg-glow"></div>
    <div class="scan-line"></div>

    <div class="particles" id="particles"></div>

    <div class="wordmark">
      <span class="letter-a">A</span>
      <span class="brace-group">
        <span class="brace-left">{</span>
        <span class="letter-i"><span class="connector-group"><div class="connector-line"></div><div class="connector-drop-left"></div><div class="connector-drop-right"></div><div class="teal-node"></div></span>&#305;</span>
        <span class="brace-right">}</span>
      </span>
      <span class="letter-bility">bility</span>
    </div>

    <div class="tagline">Designed to Reason.&nbsp; Built to Resonate.</div>
  </div>

  <button class="replay" onclick="location.reload()">Replay</button>
  <button class="toggle-theme" onclick="toggleTheme()">Light / Dark</button>
  <button class="sound-toggle" id="soundToggle">Sound: ON</button>

<script>
  // ═══════════════════════════════════════
  // AUDIO ENGINE — Minimal & Percussive
  // ═══════════════════════════════════════
  // AUDIO ENGINE — Signature Motif (Sound A)
  // D5 → F#5 → A5 → D6 → A5 (da da da da-da)
  // ═══════════════════════════════════════
  let audioCtx = null, soundEnabled = true, masterGain = null;

  function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.5;
    masterGain.connect(audioCtx.destination);
  }

  function playNote(freq, vol, decay, delay) {
    if (!soundEnabled || !audioCtx) return;
    const t = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    osc.type = 'sine'; osc.frequency.value = freq;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, t + decay);
    osc.connect(g); g.connect(masterGain);
    osc.start(t); osc.stop(t + decay + 0.05);
  }

  // Full 5-note signature motif
  function playSignatureMotif() {
    if (!soundEnabled || !audioCtx) return;
    const notes = [
      { freq: 587.33,  time: 0,    vol: 0.10, dur: 0.22 },  // D5
      { freq: 739.99,  time: 0.25, vol: 0.10, dur: 0.22 },  // F#5
      { freq: 880.00,  time: 0.50, vol: 0.10, dur: 0.22 },  // A5
      { freq: 1174.66, time: 0.75, vol: 0.11, dur: 0.18 },  // D6
      { freq: 880.00,  time: 0.88, vol: 0.12, dur: 0.50 },  // A5 (sustains)
    ];
    notes.forEach(n => playNote(n.freq, n.vol, n.dur, n.time));
    playNote(110, 0.035, 1.5, 0.88); // Sub-bass
  }

  // ═══════════════════════════════════════
  // PARTICLES & UI
  // ═══════════════════════════════════════
  function createParticles() {
    const container = document.getElementById('particles');
    container.innerHTML = '';
    const colors = ['#A100FF', '#00C9A7', '#A100FF', '#00C9A7'];
    for (let i = 0; i < 12; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 2 + Math.random() * 4;
      p.style.cssText = `
        width: ${size}px; height: ${size}px;
        left: ${25 + Math.random() * 50}%;
        top: ${40 + Math.random() * 30}%;
        background: ${colors[i % colors.length]};
        animation-delay: ${2.5 + Math.random() * 4}s;
        animation-duration: ${4 + Math.random() * 4}s;
      `;
      container.appendChild(p);
    }
  }
  createParticles();

  function toggleTheme() { document.body.classList.toggle('light'); }

  // ═══════════════════════════════════════
  // START — unpause CSS + trigger sounds
  // Each visual element gets a note from the motif
  // ═══════════════════════════════════════
  document.getElementById('startOverlay').addEventListener('click', () => {
    initAudio();
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('logoContainer').classList.remove('paused');

    // Motif notes mapped to visual elements:
    // 0.8s  "A" appears         → D5 (note 1)
    // 1.2s  braces snap in      → F#5 (note 2)
    // 1.6s  ı fades in          → A5 (note 3)
    // 1.9s  node appears        → D6 (note 4, quick)
    // 2.2s  "bility" appears    → A5 sustained (note 5)
    // 2.6s  tagline             → sub-bass resolve

    setTimeout(() => playNote(587.33, 0.10, 0.22),  800);  // D5
    setTimeout(() => playNote(739.99, 0.10, 0.22), 1200);  // F#5
    setTimeout(() => playNote(880.00, 0.10, 0.22), 1600);  // A5
    setTimeout(() => playNote(1174.66, 0.11, 0.18), 1900); // D6
    setTimeout(() => {                                       // A5 + sub
      playNote(880.00, 0.12, 0.50);
      playNote(110, 0.035, 1.5);
    }, 2200);

    setTimeout(() => {
      document.getElementById('soundToggle').classList.add('show');
    }, 3500);
  });

  document.getElementById('soundToggle').addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    document.getElementById('soundToggle').textContent = soundEnabled ? 'Sound: ON' : 'Sound: OFF';
  });
</script>
</body>
</html>
